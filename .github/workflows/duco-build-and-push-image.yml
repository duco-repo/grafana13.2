name: Build and push Duco Grafana image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: gf13built
  PLATFORMS: linux/amd64

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.IMG_REG_HOST }}
          username: ${{ secrets.IMG_REG_USERNAME }}
          password: ${{ secrets.IMG_REG_PASSWORD }}

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          if [[ -z "${version}" ]]; then
            echo "package.json version is empty"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ secrets.IMG_REG_HOST }}/${{ env.IMAGE_NAME }}:${{ steps.package.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
