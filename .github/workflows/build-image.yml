name: Build Grafana container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "plugin_lock=$(sha256sum packaging/container/plugins.lock | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: grafana-source:${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
            PLUGIN_LOCK_SHA256=${{ steps.metadata.outputs.plugin_lock }}
